name: Auto Assign

on:
  pull_request:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Select a random user
        id: select-user
        run: echo "SELECTED_USER=$(shuf -n 1 .github/auto_assign_users.txt)" >> $GITHUB_ENV

      - name: Add reviewer and assignee
        uses: kentaro-m/auto-assign-action@v2.2.0
        with:
          addReviewers: true
          addAssignees: true
          reviewers: ${{ env.SELECTED_USER }}
          assignees: ${{ env.SELECTED_USER }}
